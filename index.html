<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>손정윤키우기 v0.1</title>
<style>
:root{--bg:#11152a;--panel:#202944;--edge:#7785a6;--ink:#f4f0dd;--gold:#ffd35a;--pink:#ff6c87;--blue:#6ba9ff}*{box-sizing:border-box}body{margin:0;background:#090c18;color:var(--ink);font-family:Consolas,"Malgun Gothic",monospace;image-rendering:pixelated}.game{max-width:1080px;min-height:100vh;margin:auto;background:var(--bg);border-inline:4px solid #050611}button{font:inherit;color:inherit}.pixel{border:3px solid #050611;box-shadow:inset 0 0 0 2px var(--edge),4px 4px 0 #050611}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#161e36;border-bottom:4px solid #050611}h1{font-size:clamp(19px,4vw,30px);margin:0;color:var(--gold);text-shadow:3px 3px #80394e}.tools{margin-left:auto;display:flex;gap:7px}.iconbtn{background:var(--panel);border:3px solid #050611;padding:8px 11px;cursor:pointer}.clock{padding:9px 15px;display:flex;justify-content:space-between;background:#27304c;border-bottom:3px solid #050611;font-weight:bold}.progress{display:none;margin:10px;padding:10px;background:#242e54}.progress.show{display:block}.bar{height:20px;background:#090c18;border:3px solid #050611;overflow:hidden}.fill{height:100%;background:var(--pink);transition:width .25s}.progress .fill{background:var(--blue)}.layout{display:grid;grid-template-columns:1.35fr .8fr;gap:12px;padding:12px}.scene{min-height:410px;position:relative;overflow:hidden;background:linear-gradient(#465273 0 62%,#493b42 62%);display:flex;justify-content:center;align-items:flex-end}.scene:before{content:"";position:absolute;inset:12% 8% 34%;background:#263451;border:6px solid #121426;box-shadow:inset 0 0 0 4px #727b99}.scene.pc:after{content:"🖥️"}.scene.fish{background:linear-gradient(#7ba7bd 0 48%,#497991 48% 70%,#637b4a 70%)}.scene.fish:after{content:"🎣"}.scene.friends{background:linear-gradient(#54486d 0 65%,#614d3c 65%)}.scene.friends:after{content:"🎮"}.scene.garden{background:linear-gradient(#8caec1 0 52%,#678848 52%)}.scene.garden:after{content:"🌱"}.scene:after{position:absolute;right:12%;bottom:27%;font-size:74px;filter:drop-shadow(5px 5px #111)}.char{position:relative;z-index:2;width:128px;height:190px;margin-bottom:30px;animation:idle 1.1s steps(2) infinite}.head{position:absolute;left:29px;top:8px;width:70px;height:70px;background:#eab987;border:6px solid #171426}.hair{height:31px;background:#242033;border-bottom:5px solid #171426}.eyes{text-align:center;color:#15131f;letter-spacing:13px;margin:9px 0 0 9px}.body{position:absolute;left:20px;top:76px;width:88px;height:76px;background:#567ac2;border:6px solid #171426}.legs{position:absolute;left:29px;top:148px;width:25px;height:38px;background:#2f3456;border:6px solid #171426;box-shadow:45px 0 #2f3456,45px 0 0 6px #171426}.scene.working .char{animation:work .45s steps(2) infinite}@keyframes idle{50%{transform:translateY(4px)}}@keyframes work{50%{transform:translateX(5px) rotate(2deg)}}.bubble{position:absolute;z-index:3;right:5%;top:5%;max-width:53%;background:#f6f0db;color:#18192a;padding:10px;font-weight:bold}.side{display:flex;flex-direction:column;gap:11px}.card{background:var(--panel);padding:12px}.card h2{font-size:16px;margin:0 0 9px;color:var(--gold)}.boredline{display:flex;justify-content:space-between;margin-bottom:5px;font-weight:bold}.hobbies{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.hobby{min-height:92px;background:#303b5a;border:3px solid #080a13;padding:6px 3px;cursor:pointer}.hobby:hover{background:#405073;transform:translateY(-2px)}.hobby.locked{opacity:.58}.emoji{display:block;font-size:27px}.mini{display:block;font-size:10px;margin-top:4px;color:#ccd4ef}.datebtn{width:100%;padding:12px;background:#93485d;border:3px solid #080a13;font-weight:bold;cursor:pointer}.datebtn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed}footer{text-align:center;padding:10px;color:#9ca8c7;font-size:11px}.overlay{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:var(--panel);padding:18px}.modal h2{color:var(--gold);margin-top:0}.details{line-height:1.75;background:#151b31;padding:11px;border:2px solid var(--edge)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}.actions button{padding:9px 14px;border:3px solid #080a13;background:#3c4868;cursor:pointer}.actions .primary{background:#9b7d2e}.actions .danger{background:#8b3f4f}.diary{list-style:none;padding:0}.diary li{border-bottom:2px dashed #67718e;padding:8px 0;font-size:12px}.toast{position:fixed;right:15px;bottom:15px;z-index:20;background:#222b49;border:3px solid var(--gold);padding:12px;transform:translateY(180%);transition:.2s;max-width:340px}.toast.show{transform:none}.chatting:before{content:"📱";position:absolute;left:56%;bottom:33%;font-size:42px;z-index:5}.switch{padding:4px 8px;background:#34415f}
@media(max-width:760px){.layout{grid-template-columns:1fr}.scene{min-height:350px}.hobbies{grid-template-columns:repeat(3,1fr)}header{align-items:flex-start}.tools{gap:3px}.iconbtn{padding:7px}.clock{font-size:11px}}
</style></head><body><div class="game"><header><h1>손정윤키우기 <small>v0.1</small></h1><div class="tools"><button class="iconbtn" id="diaryBtn">📔</button><button class="iconbtn" id="settingsBtn">⚙️</button></div></header><div class="progress pixel" id="progress"><b id="progressName"></b><span id="progressRemain" style="float:right"></span><div class="bar"><div class="fill" id="progressFill"></div></div><small id="progressGain"></small></div><div class="clock"><span id="gameClock">DAY 1 · 08:00</span><span>현실 1분 = 게임 1시간</span></div><main class="layout"><section class="scene pixel pc" id="scene"><div class="bubble pixel" id="bubble">“아… 오늘은 뭐 하지?”</div><div class="char"><div class="head"><div class="hair"></div><div class="eyes">••</div></div><div class="body"></div><div class="legs"></div></div></section><aside class="side"><section class="card pixel"><div class="boredline"><span>💭 심심 지수</span><span id="boredomText">0 / 100</span></div><div class="bar"><div class="fill" id="boredomFill"></div></div></section><section class="card pixel"><h2>취미 선택</h2><div class="hobbies" id="hobbies"></div></section><button class="datebtn pixel" id="dateBtn" disabled>🔒 심심 지수 100 필요</button></aside></main><footer>자동 저장 · 브라우저를 닫아도 시간은 계속 흐릅니다.</footer></div><div class="overlay" id="overlay"><div class="modal pixel" id="modal"></div></div><div class="toast" id="toast"></div><script src="game.js"></script><script>
const G=SJGame,KEY='sonjeongyun-game-v02';let state=load(),pending=[];const $=id=>document.getElementById(id);
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?.version===2?x:G.create()}catch{return G.create()}}function save(){state.lastSaved=Date.now();localStorage.setItem(KEY,JSON.stringify(state))}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.add('show');clearTimeout(e.timer);e.timer=setTimeout(()=>e.classList.remove('show'),3000)}function show(html){$('modal').innerHTML=html;$('overlay').classList.add('show');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){$('overlay').classList.remove('show')}function meter(v,max){return Math.min(100,v/max*100)}
function events(es){es.forEach(e=>{const h=G.byId(e.id);if(e.type==='complete')toast(`${h.short} 완료! 지루함 +${e.gain}`);if(e.type==='max')pending.push(e)});if(pending.length&&!$('overlay').classList.contains('show'))showMax(pending.shift())}function showMax(e){const h=G.byId(e.id);show(`<h2>✨ ${h.short}에 질려버렸습니다!</h2><p>“아… 이것도 이제 재미없네.”</p><div class="details">지루함 ${h.max} / ${h.max}<br>심심 지수 +${e.reward}<br>회복 기간: ${G.remaining(h.recoverMin*G.MINUTE_MS)}</div><div class="actions"><button class="primary" data-close>확인</button></div>`)}
function active(){return state.normalActive||state.chatActive}function render(){const now=Date.now();events(G.sync(state,now));$('gameClock').textContent=G.clock(state,now).text;$('boredomText').textContent=`${state.boredom} / 100`;$('boredomFill').style.width=state.boredom+'%';const a=active(),h=a&&G.byId(a.id);$('progress').classList.toggle('show',!!a);if(a){const left=a.endAt-now,total=a.endAt-a.startAt;$('progressName').textContent=`${h.icon} ${h.short} 진행 중`;$('progressRemain').textContent=G.remaining(left);$('progressFill').style.width=Math.max(0,(1-left/total)*100)+'%';$('progressGain').textContent=`완료 시 지루함 +${a.gain}`}const n=state.normalActive&&G.byId(state.normalActive.id),c=state.chatActive&&G.byId(state.chatActive.id);$('scene').className=`scene pixel ${n?.scene||'pc'} ${n?'working':''} ${c?'chatting':''}`;$('bubble').textContent=`“${c?.line||n?.line||(state.boredom>=100?'소개팅… 한 번 나가볼까?':'아… 오늘은 뭐 하지?')}”`;$('hobbies').innerHTML=G.HOBBIES.map(x=>{const s=state.hobbies[x.id],a=G.availability(state,x.id,now);return`<button class="hobby ${a.ok?'':'locked'}" data-id="${x.id}"><span class="emoji">${x.icon}</span><b>${x.short}</b><span class="mini">${s.value}/${x.max}${x.type==='chat'?` · ${s.dailyUses}/${x.daily}`:''}</span></button>`}).join('');document.querySelectorAll('.hobby').forEach(b=>b.onclick=()=>openHobby(b.dataset.id));$('dateBtn').disabled=state.boredom<100||state.stepCleared;$('dateBtn').textContent=state.stepCleared?'✅ STEP 1 CLEAR':state.boredom>=100?'💌 소개팅 제안 확인하기':'🔒 심심 지수 100 필요';save()}
function openHobby(id){const now=Date.now(),h=G.byId(id),s=state.hobbies[id],a=G.availability(state,id,now),gain=G.expected(state,id),cool=h.type==='normal'?(s.cooldownUntil>now?G.remaining(s.cooldownUntil-now):'이용 가능'):`오늘 ${h.daily-s.dailyUses}회 남음`,rec=s.recoverUntil>now?G.remaining(s.recoverUntil-now):'회복 상태 아님';show(`<h2>${h.icon} ${h.name}</h2><div class="boredline"><span>지루함</span><span>${s.value} / ${h.max}</span></div><div class="bar"><div class="fill" style="width:${meter(s.value,h.max)}%"></div></div><div class="details">이번 예상 증가: +${gain}<br>소요 시간: 게임 ${h.durationMin===1?'1분':h.durationMin/60+'시간'} (현실 ${G.remaining(h.durationMin*G.MINUTE_MS)})<br>${h.type==='normal'?'이용 주기':'이용 제한'}: ${h.type==='normal'?G.remaining(h.cooldownMin*G.MINUTE_MS):`하루 ${h.daily}회`}<br>심심 지수 보상: +${h.reward}<br>남은 쿨타임/횟수: ${cool}<br>회복: ${rec}<br>반복 횟수: ${s.uses}회${a.ok?'':`<br><b>이용 불가: ${a.reason}</b>`}</div><div class="actions"><button data-close>닫기</button><button class="primary" id="doHobby" ${a.ok?'':'disabled'}>취미 이행하기</button></div>`);const b=$('doHobby');if(b)b.onclick=()=>{const r=G.start(state,id,Date.now());if(r.ok){close();save();render()}else toast(r.reason)}}
$('diaryBtn').onclick=()=>show(`<h2>📔 손정윤의 일기</h2><ul class="diary">${state.logs.length?state.logs.map(x=>`<li><b>${x.time}</b> — ${x.msg}</li>`).join(''):'<li>아직 기록이 없습니다.</li>'}</ul><div class="actions"><button data-close>닫기</button></div>`);$('settingsBtn').onclick=()=>show(`<h2>⚙️ 설정</h2><div class="details">효과음: <button class="switch" id="soundBtn">${state.sound?'ON':'OFF'}</button><br><br>손정윤키우기 v0.1<br>현실 1분 = 게임 1시간<br>Step 2는 추후 업데이트 예정입니다.</div><div class="actions"><button data-close>닫기</button><button class="danger" id="resetBtn">새 게임 시작</button></div>`);
document.addEventListener('click',e=>{if(e.target.id==='soundBtn'){state.sound=!state.sound;e.target.textContent=state.sound?'ON':'OFF';save()}if(e.target.id==='resetBtn'&&confirm('모든 진행 데이터를 삭제하고 새 게임을 시작할까요?')){localStorage.removeItem(KEY);state=G.create();pending=[];close();save();render();toast('새 게임을 시작했습니다.')}});$('dateBtn').onclick=()=>{if(!state.stepCleared)show('<h2>💬 소개팅 제안</h2><div class="details"><b>친구</b><br>“야 정윤아. 소개팅 들어왔는데 해볼래?”</div><div class="actions"><button id="reject">거절</button><button class="primary" id="accept">수락</button></div>')};document.addEventListener('click',e=>{if(e.target.id==='reject'&&G.rejectDate(state)){close();save();render();toast('거절했습니다. 심심 지수 -30')}if(e.target.id==='accept'&&G.acceptDate(state)){save();show('<h2>🎉 STEP 1 CLEAR!</h2><p>손정윤의 소개팅 약속이 성사됐습니다!</p><div class="details">Step 2 소개팅 게임은 추후 업데이트 예정입니다.</div><div class="actions"><button class="primary" data-close>확인</button></div>');render()}});$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};
const away=Date.now()-state.lastSaved;if(away>5000){events(G.sync(state,Date.now()));toast('오프라인 진행을 반영했습니다.')}render();setInterval(render,500);setInterval(save,10000);addEventListener('beforeunload',save);
</script></body></html>
